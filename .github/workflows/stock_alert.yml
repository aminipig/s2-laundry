name: Stock Alert to Telegram

on:
  schedule:
    # 01:45 UTC = 08:45 น. เวลาไทย (สหรัฐฯ หลังปิดตลาด: อังคาร-เสาร์)
    - cron: '45 1 * * 2-6'
    # 02:00 UTC = 09:00 น. เวลาไทย (ไทย ก่อนเปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 2 * * 1-5'
    # 08:00 UTC = 15:00 น. เวลาไทย (สหรัฐฯ ก่อนเปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 8 * * 1-5'
    # 10:00 UTC = 17:00 น. เวลาไทย (ไทย หลังปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      target:
        description: 'เลือกรอบที่ต้องการส่ง (all / us_close / thai_morning / us_pre / thai_evening)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - us_close
          - thai_morning
          - us_pre
          - thai_evening

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance feedparser beautifulsoup4 deep-translator

      # รอบที่ 1: 08:45 น. สหรัฐฯ หลังปิดตลาด
      - name: Run US Close (08:45 น. ไทย)
        if: github.event.schedule == '45 1 * * 2-6' || github.event.inputs.target == 'us_close' || github.event.inputs.target == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py --session us_close

      # รอบที่ 2: 09:00 น. ไทย ก่อนเปิดตลาด
      - name: Run Thai Morning (09:00 น. ไทย)
        if: github.event.schedule == '0 2 * * 1-5' || github.event.inputs.target == 'thai_morning' || github.event.inputs.target == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py --session thai_morning

      # รอบที่ 3: 15:00 น. สหรัฐฯ ก่อนเปิดตลาด
      - name: Run US Pre-market (15:00 น. ไทย)
        if: github.event.schedule == '0 8 * * 1-5' || github.event.inputs.target == 'us_pre' || github.event.inputs.target == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py --session us_pre

      # รอบที่ 4: 17:00 น. ไทย หลังปิดตลาด
      - name: Run Thai Evening (17:00 น. ไทย)
        if: github.event.schedule == '0 10 * * 1-5' || github.event.inputs.target == 'thai_evening' || github.event.inputs.target == 'all'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_alert.py --session thai_evening
