name: Stock Alert to Telegram

on:
  schedule:
    # 01:45 UTC = 08:45 น. เวลาไทย (สหรัฐฯ หลังปิดตลาด: อังคาร-เสาร์)
    - cron: '45 1 * * 2-6'
    # 02:00 UTC = 09:00 น. เวลาไทย (ไทย ก่อนเปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 2 * * 1-5'
    # 08:00 UTC = 15:00 น. เวลาไทย (สหรัฐฯ ก่อนเปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 8 * * 1-5'
    # 10:00 UTC = 17:00 น. เวลาไทย (ไทย หลังปิดตลาด: จันทร์-ศุกร์)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      target:
        description: 'เลือกรอบที่ต้องการส่ง (auto / us_close / thai_morning / us_pre / thai_evening / all)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - us_close
          - thai_morning
          - us_pre
          - thai_evening
          - all

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests yfinance feedparser beautifulsoup4 deep-translator

      - name: Run Stock Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          python stock_alert.py
