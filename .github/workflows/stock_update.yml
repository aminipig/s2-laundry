name: Daily Stock Update to Telegram

on:
  schedule:
    # 02:00 UTC = 09:00 น. (รอบหุ้นไทย)
    # 07:00 UTC = 14:00 น. (รอบหุ้นสหรัฐฯ)
    # ทำงานทุกวันจันทร์-ศุกร์ (1-5)
    - cron: '0 2,7 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: 'เลือกรอบการรัน (auto / thai / us)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - thai
          - us

jobs:
  run-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SESSION_OVERRIDE: ${{ github.event.inputs.session }}
        run: |
          python main.py
