        run: |
          curl -X GET "https://siinyeuyvzzhstjzcwdo.supabase.co/rest/v1/s2_records?select=*&limit=1" \
          -H "apikey: sb_publishable_GWMnCCLeCC36JkbneN0orA_Jffu2Fxg" \
          -H "Authorization: Bearer sb_publishable_GWMnCCLeCC36JkbneN0orA_Jffu2Fxg" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

