    # รันทุกวันอังคาร และวันพฤหัสบดี เวลา 01:15 น. เวลาไทย (18:15 UTC ของวันจันทร์และพุธ)
    - cron: '15 18 * * 1,3'
  workflow_dispatch: # กดสั่งรันมือเพื่อทดสอบได้ทันที

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # Project 1: s2-laundry
      # ==========================================
      - name: Ping DB - s2-laundry
        run: |
          curl -s -X POST "https://kcrtbxecjcjytnlxgzcv.supabase.co/rest/v1/rpc/keep_alive_ping" \
          -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjcnRieGVjamNqeXRubHhnemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTQxMjksImV4cCI6MjEwMTA3MDEyOX0.B7lLRB8PIFdw4XKskcfliKUUdjMrQkSIi-jw95LRyDU" \
