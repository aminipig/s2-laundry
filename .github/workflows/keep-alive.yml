name: Keep Supabase Alive

on:
  schedule:
    # รันทุกวันจันทร์ วันพุธ และวันศุกร์ เริ่มต้นกระบวนการตอน 06:00 น. เวลาไทย (23:00 UTC)
    - cron: '0 23 * * 0,2,4'
  workflow_dispatch: # ทำให้เรากดสั่งรันเองจากหน้าเว็บ GitHub ได้ด้วย

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # Project 1: s2-laundry (Updated URL & Key)
      # ==========================================
      - name: Random Delay before Project 1
        run: |
          DELAY=$((RANDOM % 1800 + 1)) # สุ่มเวลา 1 ถึง 30 นาที (1800 วินาที)
          echo "Waiting for $DELAY seconds before pinging Project 1..."
          sleep $DELAY

      - name: Ping DB - s2-laundry
        run: |
          curl -X GET "https://kcrtbxecjcjytnlxgzcv.supabase.co/rest/v1/s2_records?select=*&limit=1" \
          -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjcnRieGVjamNqeXRubHhnemN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTQxMjksImV4cCI6MjEwMTA3MDEyOX0.B7lLRB8PIFdw4XKskcfliKUUdjMrQkSIi-jw95LRyDU" \
